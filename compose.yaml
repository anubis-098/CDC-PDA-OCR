services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-pda_ocr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pda}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-pda_ocr}
      OCR_LANG: ${OCR_LANG:-th}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.85}
      UPLOAD_DIR: /data/uploads
      HOME: /home/app
    volumes:
      - uploads:/data/uploads
      - ocr_models:/home/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:${DEV_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
  ocr_models:
  caddy_data:
  caddy_config:
